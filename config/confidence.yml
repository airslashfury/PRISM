# Confidence taxonomy for PRISM (MVP3 Pillar 1 — Truth & Provenance).
#
# Every derived table (and every global assumption baked into a model) is
# stamped with a `method` and a `confidence_tier` from the four below, plus a
# one-line `assumptions` note and an `upgrade_path` describing what would move
# it to a higher tier. The provenance API (`prism/provenance/`) merges this
# file with `catalog/metadata.json` at request time — nothing here duplicates
# row counts / pull dates / checksums, which stay in the catalog.
#
# Tiers are ordered from most to least certain. A figure's tier is the tier of
# its *weakest* required input (e.g. a composite score that uses a Proxy
# relationship is itself Proxy, even if every other input is Authoritative).

tiers:
  authoritative:
    label: Authoritative
    rank: 1
    color: "#2563eb"          # blue
    description: >-
      Government or federal data, measured directly (WFS layers, Census TIGER/ACS,
      USGS 3DEP, OSM/HIFLD geometry, FEMA flood zones). Rendered at full precision.
  modeled:
    label: Modeled
    rank: 2
    color: "#16a34a"          # green
    description: >-
      PRISM's own computation over Authoritative inputs using a documented method
      (betweenness centrality, ILP optimization, Dijkstra cost-surface routing,
      VOLL exposure). Internally consistent and reproducible; correctness depends
      on the method and on its inputs' tiers.
  proxy:
    label: Proxy
    rank: 3
    color: "#d97706"          # amber
    description: >-
      A spatial or statistical approximation standing in for a relationship that
      is not publicly published (chiefly substation→facility feeder assignment,
      built from a Voronoi / voltage-hierarchy heuristic at confidence 0.4-0.7).
      Good for ranking; rounded display only — never false precision.
  estimated:
    label: Estimated
    rank: 4
    color: "#9ca3af"          # gray
    description: >-
      A national or literature constant used as a default in the absence of a
      Puerto Rico-specific measurement (VOLL $/kWh, discount rate, bridge span,
      outage duration). Same for every asset of its type until replaced with a
      local figure.

# ── derived tables ──────────────────────────────────────────────────────────
# Keyed by "schema.table" to match catalog/metadata.json's `derived:` entries.
tables:
  sync.generation_status:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Per-plant current output from PREPA's operational portal
      (operationdata.prepa.pr.gov), the utility's own published generation data —
      authoritative for MW. The online/offline `status` is INFERRED from
      site_total_mw > 0 (the feed has no explicit status field), so that flag is
      Modeled, not measured. Plant→substation `entity_id` is a name prefix match
      (best-effort, `matched` flag distinguishes); supply-side only — it does NOT
      establish which substation feeds whom.
    upgrade_path: >-
      An explicit unit-status field from PREPA would make `status` Authoritative.

  sync.grid_snapshot:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Island-wide generation (MW) and grid frequency (Hz) — the latest point of
      PREPA's published rolling 24h feed. Single-row latest snapshot; historical
      archive is a future increment.
    upgrade_path: null

  sync.luma_outages:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Customers-without-service counts per LUMA operational region from the
      MiLUMA portal (api.miluma.lumapr.com) — the utility's own published
      delivery-side numbers. Region grain (7 regions) is the only granularity
      the feed exposes; island-wide figures are a straight sum across regions.
      PRISM has no region→municipio crosswalk yet, so no local (barrio or
      municipio) outage figure is ever inferred from these counts.
    upgrade_path: >-
      A LUMA region→municipio crosswalk (or a per-municipio outage feed) would
      allow a local outage figure instead of the island-wide one.

  graph.entities:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Entities are typed extractions of features from authoritative sources
      (HIFLD substations/transmission, OGP/PRITS WFS facilities, Census TIGER
      barrios/municipios) — geometry and attributes are not modeled.
    upgrade_path: null

  graph.relationships:
    method: mixed (measured geometry · measured feeders · Voronoi proxy)
    confidence_tier: proxy
    assumptions: >-
      LOCATED_IN, CONNECTS_TO, SERVES and CROSSES are geometric joins on measured
      geometry (confidence ~1.0). POWERS is now SPLIT by `method`: substation→barrio
      edges for 799 of 901 barrios are `feeder_topology` — MEASURED from PREPA's
      actual distribution conductors (`graph.feeder_service`), confidence 0.8-0.9,
      tier Modeled. The remaining POWERS edges stay the Voronoi/voltage-hierarchy
      proxy at 0.4-0.7: all point facilities (hospital/health_center/water_plant/
      pump/well/telecom), and the 102 barrios whose measured source substation is
      FEEDS-isolated (kept on proxy so they never drop from upstream cascades).
      FEEDS (substation→substation) is still the Voronoi voltage-hierarchy proxy.
      The table's tier stays Proxy because its weakest edges are still Proxy —
      read the per-edge `method`/`confidence`, not the table tier. The pre-swap
      Voronoi POWERS is preserved in graph.relationships_powers_voronoi_bak.
    upgrade_path: >-
      Extend the measured feeder assignment to point facilities (facility →
      containing barrio → that barrio's measured substation) and wire the 22
      FEEDS-isolated source substations into the transmission graph, which would
      move the rest of POWERS off the proxy. A LUMA feeder + FEEDS-topology
      agreement would make it fully Authoritative.

  graph.road_edges:
    method: measured
    confidence_tier: authoritative
    assumptions: OSM/WFS road centerlines noded into a routable graph; geometry not modeled.
    upgrade_path: null

  graph.road_vertices:
    method: measured
    confidence_tier: authoritative
    assumptions: Topology vertices derived directly from road_edges noding.
    upgrade_path: null

  graph.tx_network:
    method: measured
    confidence_tier: authoritative
    assumptions: ST_Node of measured HIFLD transmission-line geometry (25 m snap tolerance).
    upgrade_path: null

  graph.downstream_summary:
    method: mixed (measured-feeder population · proxy facilities)
    confidence_tier: proxy
    assumptions: >-
      Per-substation downstream population/facility counts walk FEEDS then POWERS.
      Since the feeder swap, the POPULATION term is largely MEASURED — it follows
      the `feeder_topology` substation→barrio edges (real conductors) for 799 of
      901 barrios; only 102 FEEDS-isolated barrios still contribute via the
      Voronoi proxy. The FACILITY counts (hospitals/water plants/health centers)
      still walk the Voronoi proxy POWERS edges, so a consequence figure that
      leans on facilities stays Proxy. Table tier stays Proxy on the weakest-input
      rule; population figures are now materially better grounded than pre-swap.
    upgrade_path: Same as graph.relationships — measured facility POWERS + FEEDS repair.

  graph.water_service_area:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Each barrio mapped to the AAA operating area(s) whose potable-water mains
      (g37_agua_w_main_2017, Authoritative geometry) physically pass through it
      via ST_Intersects. The operarea grouping is AAA's own; the barrio↔area
      overlay is a Modeled spatial join. Backs the WATER_SERVES edges, which —
      like the substation→pump POWERS edges — remain Proxy (no real electric
      feeder or pipe routing). 2017 vintage.
    upgrade_path: >-
      Replace operarea-nearest assignment with real AAA pressure-zone / pipe
      network topology; a LUMA feeder agreement closes the substation→pump side.

  resilience.spof_scores:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Betweenness centrality and articulation points computed with NetworkX over
      the undirected CONNECTS_TO graph — a measured topology, so the ranking
      itself is Modeled, not Proxy.
    upgrade_path: null

  resilience.cascade_scores:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      Downstream criticality (hospital=10, water_plant=5, health_center=3,
      barrio=1) is scaled by POWERS-relationship confidence — inherits the
      feeder-assignment Proxy tier.
    upgrade_path: Same as graph.relationships.

  resilience.scenario_scores:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      Composite = hazard_probability × cascade_impact × (1 + betweenness).
      Hazard and betweenness terms are Modeled over Authoritative hazard layers;
      the cascade term is Proxy, so the composite — and any ranking derived from
      it — is Proxy overall. Strong for relative ranking, weaker for absolute
      population claims.
    upgrade_path: Same as graph.relationships.

  resilience.score_history:
    method: derived
    confidence_tier: proxy
    assumptions: >-
      Append-only snapshot of resilience.scenario_scores taken at every
      (re)score: one score_runs row per rescore + the full ranked list in
      score_history. Inherits the composite score's Proxy tier — it records
      what the model said, it computes nothing new. Rank-movement headlines in
      the overview's What-changed stream diff the two most recent runs.
    upgrade_path: Same as resilience.scenario_scores.

  resilience.community_resilience:
    method: modeled
    confidence_tier: proxy
    assumptions: >-
      Per-barrio score = svi_component (50%, Modeled over real ACS data) +
      infra_density_score (30%) + recovery_factor (20%, derived from the latest
      portfolio run, which is Proxy). Inherits the Proxy tier via recovery_factor.
    upgrade_path: Same as graph.relationships.

  optimize.intervention_catalog:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Per-substation intervention costs (FEMA BRIC unit costs) and benefits.
      Early version (v1) used income-proxy benefits; superseded by v2/v3.
    upgrade_path: null

  optimize.portfolio_runs:
    method: modeled
    confidence_tier: modeled
    assumptions: Phase 4 greedy-knapsack portfolio over the v1 catalog.
    upgrade_path: null

  optimize.intervention_catalog.v2:
    method: modeled
    confidence_tier: proxy
    assumptions: >-
      Adds population_benefit_usd / economic_benefit_usd from VOLL exposure,
      which is itself Proxy (depends on FEEDS/POWERS downstream population).
      Costs and capacities are Modeled/Authoritative; benefits are Proxy —
      catalog is Proxy overall for ranking purposes.
    upgrade_path: Same as graph.relationships.

  optimize.intervention_catalog.v3:
    method: modeled
    confidence_tier: proxy
    assumptions: >-
      v2 + weighted_svi (population-weighted Social Vulnerability Index) and
      equity_adjusted_benefit_usd. SVI itself is Modeled over real ACS data, but
      the population weighting again routes through the Proxy FEEDS/POWERS graph.
    upgrade_path: Same as graph.relationships.

  optimize.portfolio.ilp:
    method: modeled
    confidence_tier: proxy
    assumptions: >-
      scipy.optimize.milp exact ILP over intervention_catalog.v3 — the
      optimization itself is exact given its inputs, but those inputs are Proxy
      (see intervention_catalog.v3). Budget allocation rankings are robust;
      absolute dollar/population figures inherit the Proxy ceiling.
    upgrade_path: Same as graph.relationships.

  economy.barrio_economics:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Per-tract population/income/poverty/elderly/disability from Census 2020
      blocks + ACS 5-yr 2022 (real per-tract data, CENSUS_API_KEY set). The
      5-component SVI (poverty 30% + elderly 15% + disabled 10% + flood 30% +
      slope 15%) is a documented Modeled composite over Authoritative inputs.
    upgrade_path: null

  economy.substation_exposure:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      VOLL-based 30-yr NPV exposure = downstream population (via Proxy
      FEEDS/POWERS) × VOLL ($2,707/person, an Estimated national constant — see
      `assumptions` below). Both factors are below Authoritative, so exposure
      dollar figures should render rounded with ≈.
    upgrade_path: Same as graph.relationships, plus a PR-specific VOLL study.

  report.scenario_comparison:
    method: modeled
    confidence_tier: proxy
    assumptions: Delta between two portfolio runs — inherits optimize.portfolio.ilp's Proxy tier.
    upgrade_path: Same as graph.relationships.

  report.narratives:
    method: ai_generated
    confidence_tier: modeled
    assumptions: >-
      AI-generated prose (Sonnet/Opus) summarizing live query results — the
      narrative's claims carry the confidence tier of the figures they cite, but
      the narrative itself is not an independent measurement.
    upgrade_path: null

  transport.road_access_cost:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      pgr_dijkstra over the Authoritative road graph at a flat 40 km/h assumed
      speed (an Estimated constant — real speed limits not modeled).
    upgrade_path: Incorporate posted speed limits per road class.

  transport.bridge_inventory:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      3,168 bridge ways from OSM Overpass — geometry and tags are Authoritative.
      Span length is not in the source data; the bridge asset model defaults
      every bridge to a 50 m "medium" tier (Estimated) for cost purposes. As of
      2026-06-22, span_m is enriched from FHWA NBI (transport.nbi_bridges) for
      2128/3168 (67%) of bridges via prism.transport.nbi --enrich — those rows
      (source='fhwa_nbi') carry a measured span (Authoritative); the rest keep
      the Estimated default.
    upgrade_path: >-
      Run `python -m prism.transport.nbi --enrich` to back-fill span_m from the
      FHWA National Bridge Inventory (transport.nbi_bridges) — flips matched rows
      to a measured (Authoritative) span. PRHTA as-built records would close the
      remaining unmatched OSM bridges.

  transport.nbi_bridges:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      FHWA National Bridge Inventory as-built records for Puerto Rico — span
      length (Items 48/49) and location (Items 16/17) are reported by the owning
      agency, not modeled. Coordinates are decoded from the NBI DMS encoding;
      records with missing/zero or off-island coordinates are dropped.
    upgrade_path: null

  sync.data_sources:
    method: measured
    confidence_tier: authoritative
    assumptions: Operational registry of live WFS/OSM/NOAA feeds — last-fetch timestamps and checksums are measured, not modeled.
    upgrade_path: null

  sync.sync_log:
    method: measured
    confidence_tier: authoritative
    assumptions: Append-only audit log of sync runs.
    upgrade_path: null

  corridor.routes:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Dijkstra least-cost-path over a composite cost surface (measured terrain
      slope + Authoritative flood zones + SVI-weighted population). Per-km unit
      costs (standard/elevated/tunnel) are Estimated national construction-cost
      figures, not PR-specific bids.
    upgrade_path: Replace per-km unit costs with PR-specific construction bids.

  corridor.route_segments:
    method: modeled
    confidence_tier: modeled
    assumptions: Per-segment terrain-type breakdown of corridor.routes — same tier and caveats.
    upgrade_path: null

  sitefinder.candidate_parcels:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      Faithful load of the JP calificacion-vigente industrial parcels
      (descrip LIKE '%Industrial%') from the pr_zoning mirror. Geometry and
      zoning are authoritative; the only transform is reprojection to 32161
      and centroid/area computation.
    upgrade_path: null

  sitefinder.site_scores:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      Weighted multi-criteria overlay. Inputs mix tiers — substation, water,
      port, FEMA flood locations, and CRIM land value are Authoritative, but
      grid_reliability rides the Proxy feeder-assignment scores
      (resilience.scenario_scores), so the composite inherits Proxy per the
      weakest-input rule. Criterion weights are a documented default, not
      calibrated. Land affordability criterion (s_land_value) uses CRIM assessed
      land value per m² — authoritative assessment, not market price.
    upgrade_path: >-
      Calibrate criterion weights with stakeholder input; upgrade grid_reliability
      once feeder topology is authoritative; add market transaction price once
      CRIM sales data becomes consistently available.

  crim.parcelas:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      Official CRIM Catastro Digital parcel register, Puerto Rico — 1,535,837
      parcels downloaded 2026-06-28 via catastro.crimpr.net. Assessed values
      (TOTALVAL, LAND, STRUCTURE) are CRIM's official assessed valuations, not
      market prices. Coverage: ~93% have owner name, ~92% have valuation, ~49%
      have a sale record. Geometry reprojected from WGS84 to EPSG:32161.
    upgrade_path: >-
      Complement with CRIM transaction registry for market-price data; periodic
      re-download to pick up reassessments and new parcels.

  crim.parcelas_dedup:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      One row per num_catastro, derived from crim.parcelas by keeping the most
      recent CRIM record per parcel (DISTINCT ON, ORDER BY objectid DESC). Same
      authoritative CRIM assessed values; no geometry. Used for current
      ownership/value lookups and the Site Finder land-value join.
    upgrade_path: >-
      Formalized as a reproducible materialized view (prism/crim/schema.py) with
      an automatic refresh as the first step of the monthly snapshot cycle
      (prism.crim.snapshots.run_monthly) — done 2026-07-10, closing a gap where
      a stale dedup view could make deltas silently read as zero.

  crim.parcelas_history:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      Recorded sales per parcel (sale_rank within num_catastro) from the CRIM
      Catastro register — official recorded transactions, not market appraisals.
      Sale amounts of 0 occur (transfers, corrections). Feeds the parcel-detail
      sale history and the future sales-trend tracking.
    upgrade_path: >-
      Accumulate across monthly re-downloads to build a true longitudinal
      transaction history (item 6).

  crim.parcela_snapshots:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      Monthly frozen copy of each parcel's CRIM state (owner, assessed values,
      last sale) — one row per num_catastro per snapshot_month, sourced from
      crim.parcelas_dedup. Authoritative CRIM values, not market prices.
    upgrade_path: >-
      Accumulates one snapshot per monthly pull; the longer the series, the
      richer the trend and reassessment tracking.

  crim.parcel_deltas:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Computed diff between two consecutive monthly snapshots (new_parcel / sale
      / value_change / owner_change). Authoritative inputs, but the change
      classification is PRISM's — a sale is inferred from a newer sale date, a
      value change from a totalval difference ≥ $1. Reflects what CRIM published
      between pulls, not necessarily the legal transaction date.
    upgrade_path: >-
      Cross-check inferred sales against the CRIM transaction registry for exact
      recording dates and market prices.

  crim.geocode_cache:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      F9d D1 address-first parcel discovery. The Census Bureau's PR forward
      geocoder (public domain, keyless) resolves a street address to a
      standardized address + point at authoritative quality — but PRISM then
      does a spatial nearest-parcel lookup off that point (capped at 500m),
      which can pick the wrong parcel among close neighbors (subdivided lots,
      dense urban blocks). Only the geocoder's single-exact-match tier is
      trusted; Tie/no-match are both treated as "no confident match" and never
      guessed between. Discovery, not resolution — never presented as
      confirmed ownership.
    upgrade_path: >-
      If D2 (Census Proposed Address tiering) lands, promote the Tier-A
      Census-matched case toward authoritative for the address label itself
      (the point), while the parcel-assignment step stays proxy.

  crim.owner_rce_match:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      F11b link between a normalized CRIM owner and a PR corporations-registry
      entity. The registry record itself is authoritative; binding it to a CRIM
      owner **by name** is inference, and that is what this tier describes — a
      name collision, a company that merged or re-registered, or an entity the
      mirror has not reached yet all produce a wrong or missing link. The key is
      suffix-preserving on purpose (F1's owner_key strips LLC/INC/CORP, which is
      the token that separates two registry entities), so DANCO BUILDERS CORP and
      INC stay distinct. Three passes, in descending strength: exact key
      equality; token-sorted, for the rotated owner strings CRIM's export
      produces ("REY LLC 119 MATIENZO HATO"); and a trigram tail accepted **only**
      when independently corroborated, because similarity alone does not separate
      a real typo from a different company at the same score. More than one
      candidate is recorded as ambiguous and never resolved by guessing. Reaches
      only the corporate slice — individuals and SUCESION estates have no
      registry record at all, so this can never describe most CRIM owners.
    upgrade_path: >-
      Re-run once prism.sync.rcp finishes the full ~560K walk (the rate is only
      as complete as the mirror). Beyond that, the ceiling is name-based joining
      itself: a registry-published catastro or a shared official identifier
      would make the link authoritative rather than inferred.

  crim.rce_status_history:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      F11c slowly-changing dimension over registry status. The status values are
      the Departamento de Estado's own, but which CRIM owner they attach to is
      F11b's name-based inference, so the row is only as sound as that link. The
      sharper limit is the observation window: the registry publishes current
      state and overwrites it, so PRISM only sees a change if it polled on both
      sides of it. An absence of transitions therefore means "not observed
      between polls", never "nothing changed" — and a company that dissolved and
      was revived between two polls leaves no trace at all. Terminal statuses are
      a deliberate strict subset of the registry's own isStatusTerminal flag
      (CONVERSIÓN and ENMENDADA are excluded — an amended or converted company is
      still alive).
    upgrade_path: >-
      Shorten the polling interval on the matched set, or ingest the registry's
      filing-transaction history if it ever becomes reachable without owner/admin
      auth, which would give real effective dates instead of observation dates.

  crim.rce_addresses:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      F11b normalization of the address blocks the corporations registry
      publishes per entity. The addresses are transcribed faithfully, but their
      *meaning* is what makes this proxy: a shared address is evidence, never an
      identity claim. Resident-agent and law-firm offices host hundreds of
      unrelated entities, so co-occupancy only carries signal at low frequency —
      hence the entity_count and is_agent_office flag on
      crim.rce_address_entities (>10 entities). The registry's free-text city is
      resolved to a canonical municipio only on an exact folded name match
      (~92% of address rows); barrios, urbanizaciones, and mainland cities are
      left unresolved rather than guessed at.
    upgrade_path: >-
      Geocode the unresolved ~8% to place them spatially instead of by name, which
      would also let a registered address be tied to a barrio rather than only a
      municipio.

  sync.aee_circuit:
    method: aggregate of sync.aee_feeders (one row per circuit)
    confidence_tier: authoritative
    assumptions: >-
      Per-feeder-circuit rollup of the authoritative conductor geometry (collected
      geom + total length), a coarser helper for substation/barrio assignment.
      Rebuilt from sync.aee_feeders on every feeders-load, so it carries that
      table's tier.
    upgrade_path: null

  graph.feeder_substation:
    method: spatial join (conductor within 50 m of a substation point)
    confidence_tier: modeled
    assumptions: >-
      Each feeder circuit assigned to the substation its conductors physically
      emanate from — a cross-dataset spatial join (HIFLD substation points x PREPA
      conductors), since substations carry no circuit code. The conductors touch
      their source substation at ~0 m, so the link is strong, but crossing two
      independently-sourced datasets makes it Modeled, not Authoritative. 1,297
      of 1,340 circuits reach a substation within 50 m; the other 43 are left
      unassigned, never guessed. Per-row confidence 0.8-0.9 by touch distance
      (the assignment is capped at 50 m, so the 0.6 fallback tier is unreached).
    upgrade_path: >-
      A PREPA substation-to-feeder ownership table would make this an exact key
      join instead of a spatial inference.

  graph.feeder_barrio:
    method: measured conductor-in-barrio length (ST_Intersection)
    confidence_tier: modeled
    assumptions: >-
      Circuit -> barrio weighted by the conductor length physically inside each
      barrio (ST_Intersection of feeder segments with Census barrio polygons) -
      the measured service footprint the Voronoi proxy only approximates. PRISM
      computation over two Authoritative geometries, hence Modeled.
    upgrade_path: null

  graph.feeder_service:
    method: rollup of feeder_substation x feeder_barrio
    confidence_tier: modeled
    assumptions: >-
      Substation -> barrio, the measured analogue of the Voronoi POWERS edge: a
      substation powers a barrio when its circuits' conductors run through it,
      weighted by total conductor length. Covers 900 of 901 barrios (all but uninhabited Isla de Mona). Against the
      proxy it agrees on the primary substation for only ~49% of barrios - where
      they differ the conductor evidence favors this table (the proxy picks by
      Voronoi-cell centroid, this by physical wire). Kept SEPARATE from POWERS;
      folding it in is a gated step because it ripples through downstream_summary,
      resilience, and economy.
    upgrade_path: >-
      Gated swap: replace the Voronoi POWERS edges with these, lifting
      graph.relationships (and everything downstream) out of the Proxy tier.

  sync.aee_feeders:
    method: authoritative mirror (PREPA/AEE distribution feeder network)
    confidence_tier: authoritative
    assumptions: >-
      The real distribution feeder network from PREPA's GE Smallworld GIS,
      486,725 conductor segments with NODE1_ID/NODE2_ID topology, voltage,
      overhead/underground, and circuit id — the measured geometry behind
      PRISM's Voronoi feeder proxy. Keyed on the Smallworld G3E_FID (globally
      unique, verified across the full mirror). Loaded from the data/raw chunks,
      never straight off the network. voltage_kv is kept as the source string
      ('7.62/13.20'), not parsed to a number.
    upgrade_path: >-
      Building the substation->feeder->barrio assignment from this topology
      replaces the Voronoi/voltage-hierarchy proxy in graph.relationships with
      measured feeder routing, lifting FEEDS/POWERS and everything downstream
      of them from Proxy toward Authoritative.

  sync.aee_shed_feeders:
    method: authoritative mirror (PREPA/AEE Manual Load Shedding FeatureServer)
    confidence_tier: authoritative
    assumptions: >-
      PREPA's own manual load-shedding plan: 792 distribution feeders with the
      polygons they serve, the shed STAGE (1-3 or CRITICAL STAGE), customer
      count, and live STATUS. Authoritative because it is the operator's own
      published plan, not a PRISM inference. Two source caveats travel with it:
      MW is unreliable per the dashboard's own labeling (CLIENTS is the solid
      consequence metric), and the polygons are service areas, not the feeder
      conductor geometry. 20 of the 792 source polygons are invalid as published
      (nested shells) and are repaired with ST_MakeValid on load — the data/raw
      mirror keeps the source exactly as PREPA published it. Loaded from those
      mirrors, never straight off the network, so a vanished dashboard cannot
      erase what PRISM holds.
    upgrade_path: >-
      Manual_Load_Shedding_Base_Data carries the real 486,725-segment
      distribution network with NODE1_ID/NODE2_ID topology — mirroring and
      loading that replaces PRISM's Voronoi feeder proxy with measured
      geometry and lifts the feeder layer's tier.

  sync.aee_shed_history:
    method: append-only snapshot series
    confidence_tier: authoritative
    assumptions: >-
      One row per (snapshot, feeder), banked every time the source's
      lastEditDate advances (~30 min). This is the only record of a shed
      EVENT over time — PREPA publishes current state and overwrites it, so a
      shedding episode is unrecoverable once it ends unless PRISM banked it.
      Coverage starts 2026-07-18; there is no backfill before that date and
      gaps exist whenever the poller was not running. Interpret a missing
      interval as "not observed", never as "no shedding".
    upgrade_path: >-
      A worker cron on the same cadence as the other live feeds would close
      the observation gaps and make the series continuous.

  ocpr.contracts:
    method: authoritative mirror (Oficina del Contralor register)
    confidence_tier: authoritative
    assumptions: >-
      F11e — Puerto Rico's official government-contract register, mirrored
      whole (2012→today, 1.14M contracts). The amounts, dates, agencies and
      contractor names are the Contralor's own record, not a PRISM estimate.
      One caveat travels with every amount: a contract with multiple
      contractors carries the FULL amount against each of them in the source,
      so summing by contractor over-counts. PRISM marks such rows shared
      rather than dividing a number the register never divided.
    upgrade_path: >-
      Per-contractor allocations exist only inside the contract PDFs
      (lazy-fetchable by document GUID); parsing them would let the shared
      amounts be split for real instead of flagged.

  ocpr.government_keys:
    method: normalized-name set (contracting entities + public-body prefixes)
    confidence_tier: modeled
    assumptions: >-
      F11e — which owner keys are public bodies, used to default the
      contractor ranking to private landowners. Data-driven core: every
      distinct OCPR contracting entity_name run through normalize_owner()
      (375 agencies, exact). Prefix sweep on top (DEPARTAMENTO, AUTORIDAD,
      MUNICIPIO, ADMINISTRACION, …) for public bodies that only ever appear
      as a contractor — that part is a heuristic and can misfile a private
      firm whose name opens with a government-sounding word.
    upgrade_path: >-
      Once the F11a corporations-registry mirror lands, a registry class
      lookup replaces the prefix heuristic with the entity's declared type.

  ocpr.owner_contract_footprint:
    method: exact join on normalized owner name
    confidence_tier: proxy
    assumptions: >-
      F11e — joins OCPR contractors to CRIM owners on
      normalize_owner(name) = owner_key. The join is on a NAME, never an
      identifier: two unrelated entities sharing a normalized name would
      merge, and one entity spelled two ways would split. 21,699 of 345,488
      distinct contractors (6.3%) match a CRIM owner. A no-match is reported
      as a no-match, never as a guess.
    upgrade_path: >-
      F11b's owner→registry matcher gives each side a registration index;
      joining on that instead of on the name removes the merge/split risk.

  crim.parcel_proposed_address:
    method: tiered (census_forward_geocode | nearest_state_road+barrio+municipio)
    confidence_tier: proxy
    assumptions: >-
      F9d D2 — a per-parcel best-effort address, surfaced beside (never in
      place of) the raw CRIM display_address(). Tier A (census_matched):
      display_address() forward-geocoded to a single confident Census match —
      the label is Census's own standardized address string. Tier B
      (composed_approximate): no confident match; composed locally from
      geometry PRISM already has — nearest *state* highway (PR only mirrors
      the numbered state-road layer, not local/municipal street names, so a
      parcel off a numbered route falls back to barrio+municipio with no
      street name rather than guessing one) + barrio + municipio, always
      labeled "Census Proposed Address — approximate, may not be accurate".
      Populated lazily off the parcel-detail read path, not a 1.5M-row batch.
    upgrade_path: >-
      If PR's local/municipal street layer is ever mirrored, Tier B gains a
      real nearest-named-street join instead of falling back past the state
      highway radius.

  sync.seismic_events:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Located earthquakes from the USGS FDSN event service (no key) for the PR /
      USVI bounding box — USGS is the seismic authority. Magnitude/depth are
      revised by USGS as more data arrives, so events are upserted on the USGS
      event id. Coverage is the USGS catalog (PRSN-contributed for PR).
    upgrade_path: >-
      Add ShakeMap intensity polygons per significant event for ground-motion
      exposure rather than epicentre proximity alone.

  sync.nhc_advisories:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      NHC forecast-cone advisories for active/replayed tropical cyclones — NHC
      is the tropical-cyclone authority. The cone is the historical
      track-error probability area (where the center is likely to travel),
      NOT a wind-field or impact footprint — a location inside the cone is
      not necessarily inside damaging winds, and one outside it is not
      necessarily safe. PR relevance (affects_pr) is a simple bounding-box
      intersection against the cone geometry, not a wind-radii or
      distance-to-track calculation.
    upgrade_path: >-
      Add NHC wind-radii (34/50/64kt) products for an actual exposure
      footprint instead of the cone-bbox proxy; layer in forecast-advisory
      text for storm-surge / rainfall guidance.

  sync.nhc_consequences:
    method: modeled
    confidence_tier: proxy
    assumptions: >-
      Pre-landfall consequence intersection: counts substations, hospitals,
      water plants, health centers, and barrios whose point/polygon geometry
      falls inside the NHC forecast cone. The cone is track-error probability,
      not a wind field, so being "inside the cone" does not mean an entity
      will actually experience damaging conditions — it is a screening
      overlay, not an impact forecast. The surge-overlap count reuses the
      Cat-2 marejada proxy from prism/resilience/hazard.py (an existing
      inundation extent, not a storm-specific surge model for this
      particular cyclone). population_served inherits the feeder-proxy tier
      from graph.downstream_summary (operating-area, not real electric
      feeder topology) — it is an upper bound, not a measured exposure.
    upgrade_path: >-
      Layer in NHC wind-radii products to narrow "in cone" to "in damaging
      wind field"; replace the Cat-2 marejada proxy with a storm-specific
      surge model (e.g. SLOSH MEOW/MOM) scaled to the advisory's forecast
      intensity; replace downstream_summary's feeder proxy with real electric
      topology once available.

  resilience.water_scores:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      Composite = criticality x hazard_exposure x power_dependency. Criticality
      (barrios served) and power_dependency (powering substation) both walk the
      Proxy WATER_SERVES/POWERS edges built in graph.water (no real pipe routing
      or electric feeder), so the composite is Proxy overall even though
      hazard_exposure alone is Modeled over Authoritative hazard layers. Good
      for relative ranking ("which water source is most at risk"), not for
      absolute claims.
    upgrade_path: >-
      Same as graph.relationships — a LUMA feeder-topology agreement and real
      AAA pipe-network topology would raise both inputs, and this score, to
      Modeled/Authoritative.

  sync.nwis_gauges:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Latest instantaneous reading (gage height / discharge) per active USGS
      gauge station in Puerto Rico, from the USGS NWIS live feed — USGS is the
      streamflow authority. Upsert-in-place (latest per site/parameter), not an
      append-only time series; a gauge with no recent report reads stale rather
      than being backfilled.
    upgrade_path: >-
      Accumulate an append-only history table (mirrors the PREPA/LUMA pattern)
      for real hydrographs instead of a latest-only snapshot.

  sync.climate_normals:
    method: measured
    confidence_tier: authoritative
    assumptions: >-
      Monthly 1991-2020 climate normals (temperature, precipitation, rain-day
      counts) for a curated set of 19 PR GHCN stations, from NOAA NCEI's Access
      Data Service — NOAA is the climate-normals authority. Static 30-year
      baseline, not a live feed; refreshed on a monthly cron mainly so a fresh
      deploy isn't empty.
    upgrade_path: >-
      A full PR station inventory (NCEI's search API returns aggregations, not
      a station list, so this is a curated subset) would tighten per-municipio
      nearest-station distance.

  resilience.telecom_scores:
    method: proxy
    confidence_tier: proxy
    assumptions: >-
      Composite = criticality x hazard_exposure x power_dependency. Criticality
      (barrios covered) walks the Proxy COVERS edge — a straight-line
      4km-radius distance proxy around each tower/cell site, not a real RF
      propagation footprint (terrain, antenna pattern, and transmit power are
      unmodeled) — and power_dependency walks the Proxy POWERS edge (nearest
      distribution substation, not the real electric feeder), so the composite
      is Proxy overall even though hazard_exposure alone is Modeled over
      Authoritative hazard layers. Good for relative ranking ("which telecom
      node is most at risk"), not for absolute claims.
    upgrade_path: >-
      Same as graph.relationships — a LUMA feeder-topology agreement and an
      FCC/carrier RF coverage model would raise both inputs, and this score,
      to Modeled/Authoritative.

  fault_lines:
    method: authoritative
    confidence_tier: authoritative
    assumptions: >-
      Mapped geologic fault traces (normal + thrust/concealed) from the PR
      government WFS geology layers — the authoritative PR fault source (the USGS
      Quaternary Fault DB does not cover Puerto Rico). Mapped-fault geometry, not
      a probabilistic seismic-source model; slip rates / recurrence are not
      attached, so the seismic hazard component uses distance-to-fault as a
      proxy for shaking + surface-rupture exposure.
    upgrade_path: >-
      Attach slip rates / a probabilistic seismic hazard model (e.g. PRSN / USGS
      NSHM offshore sources) to weight faults by activity, not just proximity.

  validation.backtest_results:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Each event's "severely affected municipios" list is hand-curated from
      3 cited news/academic sources per event, not a per-substation outage
      GIS — a deliberate "scrappy first pass" per MVP3_PLAN.md. Precision and
      recall are honest measurements against PRISM's own rankings, but the
      ground truth itself is coarse (municipio-level, not feeder-level).
    upgrade_path: >-
      Replace hand-curated municipio lists with LUMA/PREPA outage-restoration
      GIS data per event, scored at the substation/feeder level.

  validation.sensitivity_results:
    method: modeled
    confidence_tier: modeled
    assumptions: >-
      Spearman rank correlation + top-10 overlap of substation rankings under
      +/-50% perturbations of each assumption in this file's `assumptions:`
      list. The +/-50% range and the robust threshold (rho>=0.9, overlap>=0.8)
      are documented choices, not derived from a formal uncertainty analysis.
    upgrade_path: >-
      Replace the +/-50% heuristic range with assumption-specific uncertainty
      bounds once PR-specific data narrows each estimate.

# ── global estimated constants ──────────────────────────────────────────────
# Not tables — single numbers baked into formulas across the models above.
# Surfaced on the Trust Center and used as the sweep list for P2 sensitivity
# analysis and the P3-eng assumptions panel.
assumptions:
  - key: voll_usd_per_kwh
    label: Value of Lost Load (VOLL)
    value: 5.0
    unit: USD/kWh
    confidence_tier: estimated
    used_by:
      - economy.substation_exposure
      - optimize.intervention_catalog.v2
      - optimize.intervention_catalog.v3
    assumptions: >-
      National default outage-cost figure (0.822 kW/person x $5/kWh x 33.6 hr/yr
      x 19.60 NPV factor = $2,707/person 30yr). Not PR-specific.
    upgrade_path: Commission a PR-specific VOLL study (PREB/LUMA outage-cost data).

  - key: discount_rate
    label: Discount rate (NPV)
    value: 0.03
    unit: fraction/yr
    confidence_tier: estimated
    used_by:
      - economy.substation_exposure
      - optimize.intervention_catalog.v2
      - corridor.routes
    assumptions: >-
      Standard public-infrastructure discount rate (3%/yr, 30-yr horizon).
      F10b (2026-07-10): reconciled economy.substation_exposure onto this
      same rate — it previously ran its own undocumented 4%/yr NPV factor.
    upgrade_path: Use PR Treasury / OMB's official discount rate if one is published.

  - key: outage_hours_per_year
    label: Annual outage hours
    value: 33.6
    unit: hours/yr
    confidence_tier: estimated
    used_by:
      - economy.substation_exposure
    assumptions: National SAIDI-style default; PR's actual post-Maria outage hours are far higher in some areas.
    upgrade_path: Use LUMA SAIDI/SAIFI filings per feeder.

  - key: feeder_assignment_radius
    label: Feeder assignment (Voronoi proxy)
    value: null
    unit: spatial heuristic
    confidence_tier: proxy
    used_by:
      - graph.relationships
    assumptions: >-
      FEEDS/POWERS assigned by nearest-substation Voronoi cell adjusted by
      voltage hierarchy — confidence 0.4-0.7 per edge.
    upgrade_path: LUMA feeder-topology data-sharing agreement.

  - key: bridge_span_default_m
    label: Default bridge span
    value: 50
    unit: meters
    confidence_tier: estimated
    used_by:
      - transport.bridge_inventory
      - prism.assets.bridge
    assumptions: OSM bridge ways carry no span attribute; every bridge defaults to the "medium" 50 m cost tier.
    upgrade_path: Pull span data from FHWA NBI via `python -m prism.transport.nbi --enrich` (transport.nbi_bridges); PRHTA as-built records for the remainder.

  - key: hazard_probability_curve
    label: Hazard probability (cat3/slr2ft/combined)
    value: null
    unit: scenario-defined
    confidence_tier: modeled
    used_by:
      - resilience.scenario_scores
    assumptions: >-
      Per-scenario hazard probabilities are Modeled overlays of Authoritative
      flood/SLR/storm-surge/slope layers, not historical-frequency statistics.
    upgrade_path: Validate against P2 event backtests (Maria/Fiona/2024 blackout).
